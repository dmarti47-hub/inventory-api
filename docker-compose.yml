services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: inventory_frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    container_name: inventory_api
    environment:
      DATABASE_URL: postgresql+psycopg://inventory_user:inventory_pass@db:5432/inventory_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: inventory_db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U inventory_user -d inventory_db
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:16
    container_name: inventory_test_db
    environment:
      POSTGRES_DB: inventory_test_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5434:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U inventory_user -d inventory_test_db
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inventory_postgres_data: