name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_test_db
          POSTGRES_USER: inventory_user
          POSTGRES_PASSWORD: inventory_pass
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U inventory_user -d inventory_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://inventory_user:inventory_pass@localhost:5434/inventory_test_db
      TEST_DATABASE_URL: postgresql+psycopg://inventory_user:inventory_pass@localhost:5434/inventory_test_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing
